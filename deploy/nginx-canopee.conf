# /etc/nginx/sites-available/canopee
# Front React (fichiers statiques) + API Django + WebSockets, tout sur le même domaine.

upstream canopee_backend {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    listen [::]:80;
    server_name canopee.coisnevalentin.be;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name canopee.coisnevalentin.be;

    # Certificat créé par certbot
    ssl_certificate /etc/letsencrypt/live/canopee.coisnevalentin.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canopee.coisnevalentin.be/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Front React compilé (npm run build)
    root /var/www/canopee;
    index index.html;

    # API REST Django
    location /api/ {
        proxy_pass http://canopee_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin Django
    location /admin/ {
        proxy_pass http://canopee_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets (Django Channels) : les en-têtes Upgrade/Connection sont indispensables
    location /ws/ {
        proxy_pass http://canopee_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Fichiers statiques de l'admin Django (python manage.py collectstatic)
    location /static/ {
        alias /var/www/canopee-static/;
    }

    # React Router : toute autre URL (/chat, /login...) renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
